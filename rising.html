<title>RISING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Spectral:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@400;500&display=swap">
<style>
/* Layout: a single centered column over a sky that moves from night to dawn as the ritual advances; embers rise behind it. */
:root {
  --night: #0e0b1c;
  --dusk: #261733;
  --ember: #ff7b3e;
  --gold: #f4c46a;
  --bone: #f4ede3;
  --ash: #a99fbb;
  --line: rgba(244, 237, 227, 0.16);
  --field: rgba(244, 237, 227, 0.06);
  --display: "Marcellus", "Trajan Pro", Georgia, serif;
  --body: "Spectral", Georgia, "Times New Roman", serif;
  --label: "Jost", "Futura", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--bone);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.6;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* Sky */
.sky, .sky > div, #embers { position: fixed; inset: 0; pointer-events: none; }
.sky .base { background: radial-gradient(120% 80% at 50% 110%, var(--dusk) 0%, var(--night) 60%); }
.sky .dawn {
  background:
    radial-gradient(90% 55% at 50% 108%, #ffb26b 0%, rgba(255,140,72,0.85) 22%, rgba(196,86,106,0.55) 48%, rgba(59,37,80,0) 78%),
    linear-gradient(to top, #6a2f4f 0%, #34204a 55%, #15102a 100%);
  opacity: var(--p, 0);
  transition: opacity 2.4s ease;
}
/* Tap In's sky: light from above instead of a sunrise from below */
.sky .gold {
  background:
    radial-gradient(80% 55% at 50% -8%, rgba(255,232,170,0.42) 0%, rgba(244,196,106,0.16) 40%, rgba(244,196,106,0) 75%),
    linear-gradient(to bottom, #2b2142 0%, #1b1631 55%, #120f24 100%);
  opacity: var(--g, 0);
  transition: opacity 2.4s ease;
}
#embers { width: 100%; height: 100%; }

/* App frame */
.app {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-inline: 20px;
  overflow-y: auto;
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding-block: 18px 6px;
  width: 100%;
  max-width: 40rem;
  margin-inline: auto;
}
.wordmark {
  font-family: var(--display);
  letter-spacing: 0.42em;
  font-size: 0.8rem;
  color: var(--gold);
  background: none;
  border: none;
  padding: 6px 0;
}
.stage {
  flex: 1;
  width: 100%;
  max-width: 36rem;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 22px;
  padding-block: 24px 40px;
  min-width: 0;
}
.scene { display: flex; flex-direction: column; gap: 22px; animation: rise 0.9s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.eyebrow {
  font-family: var(--label);
  font-size: 0.72rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ash);
}
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(2.4rem, 8vw, 3.6rem); letter-spacing: 0.06em; }
h2 { font-size: clamp(1.7rem, 5.5vw, 2.4rem); }
p { margin: 0; }
.lede { color: var(--ash); font-size: 1.05rem; max-width: 34rem; }
.quote {
  font-style: italic;
  font-weight: 300;
  font-size: clamp(1.15rem, 3.6vw, 1.35rem);
  line-height: 1.55;
  border-left: 1px solid var(--gold);
  padding-left: 18px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.cry {
  font-family: var(--display);
  font-size: clamp(2rem, 8vw, 3.2rem);
  line-height: 1.1;
  color: #fff4e2;
  text-shadow: 0 0 30px rgba(255,170,90,0.5);
  overflow-wrap: anywhere;
  text-wrap: balance;
}
.big-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.big-list li {
  font-family: var(--display);
  font-size: clamp(1.3rem, 4.4vw, 1.75rem);
  line-height: 1.25;
  opacity: 0;
  animation: rise 1s ease both;
  overflow-wrap: anywhere;
}
.big-list.small li { font-family: var(--body); font-size: 1.08rem; font-style: italic; }
.big-list li::before { content: "✦"; color: var(--ember); font-size: 0.7em; margin-right: 14px; vertical-align: 0.15em; }

/* Controls */
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn {
  font-family: var(--label);
  font-size: 0.82rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 15px 26px;
  border-radius: 999px;
  border: 1px solid var(--gold);
  background: linear-gradient(180deg, rgba(244,196,106,0.18), rgba(255,123,62,0.12));
  color: var(--bone);
  transition: background 0.3s, transform 0.2s, opacity 0.3s;
}
.btn:hover { background: linear-gradient(180deg, rgba(244,196,106,0.32), rgba(255,123,62,0.22)); }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.35; cursor: default; }
.ghost {
  font-family: var(--label);
  font-size: 0.75rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  background: none;
  border: none;
  color: var(--ash);
  padding: 10px 4px;
}
.ghost:hover { color: var(--bone); }
.pill {
  font-family: var(--label);
  font-size: 0.75rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 10px 16px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--field);
  color: var(--bone);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.pill:hover { border-color: var(--gold); }
.pill.rec { border-color: var(--ember); color: #ffd2b8; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ember); }
.pill.rec .dot { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.2; } }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 6px; }

input[type="text"], textarea {
  width: 100%;
  font: inherit;
  font-size: 1.1rem;
  color: var(--bone);
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  resize: vertical;
  box-sizing: border-box;
}
textarea { min-height: 8.5rem; line-height: 1.55; }
textarea.tall { min-height: 12rem; }
input::placeholder, textarea::placeholder { color: rgba(169,159,187,0.6); font-style: italic; }
input:focus, textarea:focus { outline: none; border-color: var(--gold); background: rgba(244,237,227,0.09); }

.meter { display: flex; gap: 6px; }
.meter span { height: 2px; flex: 1; background: var(--line); border-radius: 2px; transition: background 0.5s; }
.meter span.on { background: var(--gold); }

/* Voice field */
.voice { display: flex; flex-direction: column; gap: 10px; }
.voice-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.voice-status { font-family: var(--label); font-size: 0.8rem; letter-spacing: 0.04em; color: var(--ash); }
.voice audio, .letter-card audio { width: 100%; max-width: 100%; height: 40px; }

/* The ember (hold to rise) */
.ember-wrap { display: grid; place-items: center; padding-block: 4px; }
.ember {
  position: relative;
  width: 210px; height: 210px;
  max-width: 62vw; max-height: 62vw;
  border-radius: 50%;
  border: none;
  background: none;
  padding: 0;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.ember .core {
  position: absolute; inset: 22%;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 58%, #fff3d6 0%, var(--gold) 18%, var(--ember) 45%, rgba(196,60,40,0.85) 70%, rgba(120,30,40,0) 100%);
  box-shadow: 0 0 60px 10px rgba(255,123,62,0.45), 0 0 140px 40px rgba(255,123,62,0.15);
  animation: smolder 4.2s ease-in-out infinite;
  transition: transform 0.25s ease-out;
  transform: scale(calc(1 + var(--h, 0) * 0.45));
}
@keyframes smolder { 0%,100% { filter: brightness(0.85); } 50% { filter: brightness(1.15); } }
.ember svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ember circle { fill: none; stroke-width: 1.5; }
.ember .track { stroke: var(--line); }
.ember .ring { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset 0.1s linear; }
.hold-label { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.hold-label strong { font-family: var(--label); font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; font-size: 0.85rem; }
.hold-label span { color: var(--ash); font-style: italic; }

/* Mode picker */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 26rem; margin-inline: auto; }
.mode {
  display: flex; flex-direction: column; gap: 2px; align-items: center;
  padding: 12px 10px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--field);
  color: var(--ash);
  transition: border-color 0.3s, background 0.3s, color 0.3s;
}
.mode strong { font-family: var(--label); font-weight: 500; font-size: 0.78rem; letter-spacing: 0.2em; text-transform: uppercase; }
.mode span { font-style: italic; font-size: 0.92rem; }
.mode[aria-checked="true"] { border-color: var(--gold); color: var(--bone); background: rgba(244,196,106,0.1); }
.mode:hover { color: var(--bone); }

/* Vow follow-up */
.followup {
  width: 100%;
  max-width: 26rem;
  margin-inline: auto;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px 18px;
  border: 1px solid rgba(244,196,106,0.4);
  border-radius: 16px;
  background: rgba(244,196,106,0.07);
  text-align: left;
}
.followup p { overflow-wrap: anywhere; }
.followup .actions { justify-content: flex-start; }

/* Breath */
.breath { display: grid; place-items: center; height: 230px; }
.breath .orb {
  width: 90px; height: 90px; border-radius: 50%;
  background: radial-gradient(circle, #fff1d0 0%, var(--gold) 30%, var(--ember) 60%, rgba(255,123,62,0) 100%);
  box-shadow: 0 0 80px 20px rgba(255,123,62,0.3);
  transform: scale(var(--s, 1));
  transition: transform 4s ease-in-out;
}
.breath-cue { text-align: center; font-family: var(--label); letter-spacing: 0.4em; text-transform: uppercase; font-size: 0.85rem; color: var(--gold); min-height: 1.4em; }

.center { text-align: center; align-items: center; }
.center .actions { justify-content: center; }
.risen-title { font-size: clamp(3rem, 12vw, 5rem); letter-spacing: 0.22em; color: #fff4e2; text-shadow: 0 0 40px rgba(255,170,90,0.6); }
.notice {
  font-family: var(--label);
  font-size: 0.78rem;
  letter-spacing: 0.06em;
  color: var(--gold);
  border: 1px dashed rgba(244,196,106,0.45);
  border-radius: 10px;
  padding: 8px 12px;
}
.fine { font-family: var(--label); font-size: 0.75rem; letter-spacing: 0.06em; color: var(--ash); }

/* Saga and letters */
.saga { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.saga li { display: grid; grid-template-columns: 4.2rem 1fr; gap: 14px; padding-block: 18px; border-top: 1px solid var(--line); }
.saga .num { font-family: var(--display); font-size: 1.5rem; color: var(--gold); line-height: 1.2; }
.saga .body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.saga .date { font-family: var(--label); font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ash); }
.saga .vow { font-size: 1.08rem; overflow-wrap: anywhere; }
.saga .dim { color: var(--ash); font-style: italic; font-size: 0.95rem; overflow-wrap: anywhere; }
.chip {
  align-self: flex-start;
  font-family: var(--label);
  font-size: 0.68rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--ash);
}
.chip.carried { border-color: var(--gold); color: var(--gold); }
.letters { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.letter-card { display: flex; flex-direction: column; gap: 8px; padding-block: 18px; border-top: 1px solid var(--line); min-width: 0; }
.letter-card p { white-space: pre-wrap; overflow-wrap: anywhere; font-style: italic; font-weight: 300; }
.letter-card .clip { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.saga .card-btn { align-self: flex-start; font-size: 0.68rem; padding: 4px 0; }

/* What the saga shows */
.mirror {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 18px 20px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--field);
}
.mirror ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.mirror li { overflow-wrap: anywhere; padding-left: 24px; position: relative; }
.mirror li::before { content: "✦"; color: var(--ember); font-size: 0.7em; position: absolute; left: 0; top: 0.45em; }

/* Your myth */
.myth { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.myth li { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: start; padding-block: 16px; border-top: 1px solid var(--line); }
.myth .body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.myth .label { font-family: var(--label); font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ash); }
.myth .val { white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.myth .empty { color: var(--ash); font-style: italic; }
.myth .ghost { padding: 2px 4px; }

/* Chapter card */
.card-preview {
  display: block;
  width: 100%;
  max-width: 22rem;
  aspect-ratio: 4 / 5;
  margin-inline: auto;
  border-radius: 18px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px var(--line);
}

/* Home: Rise and Tap In. Swipe between them on a phone, side by side on a wide screen. */
.stage.wide { max-width: 66rem; }
.sides {
  display: grid;
  grid-template-columns: 1fr 1fr;
  width: 100%;
  max-width: 20rem;
  margin-inline: auto;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--field);
  box-sizing: border-box;
}
.sides button {
  font-family: var(--label);
  font-weight: 500;
  font-size: 0.75rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  padding: 9px 10px;
  border: none;
  border-radius: 999px;
  background: none;
  color: var(--ash);
  transition: background 0.3s, color 0.3s;
}
.sides button[aria-selected="true"] { background: rgba(244,196,106,0.16); color: var(--bone); }
.split {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  width: 100%;
}
.split::-webkit-scrollbar { display: none; }
.side {
  scroll-snap-align: start;
  scroll-snap-stop: always;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  padding-inline: 2px;
  box-sizing: border-box;
}
.side-title { display: none; }
@media (min-width: 900px) {
  .sides { display: none; }
  .split { grid-auto-flow: row; grid-template-columns: 1fr 1fr; overflow: visible; gap: 0; }
  .side { padding-inline: 36px; }
  .side + .side { border-left: 1px solid var(--line); }
  .side-title { display: block; font-family: var(--display); letter-spacing: 0.42em; text-transform: uppercase; font-size: 0.9rem; color: var(--gold); }
}

/* The well (tap in) */
.well {
  position: relative;
  width: 210px; height: 210px;
  max-width: 62vw; max-height: 62vw;
  border-radius: 50%;
  border: none;
  background: none;
  padding: 0;
}
.well .pool, .well .ripple { position: absolute; inset: 24%; border-radius: 50%; }
.well .pool {
  background: radial-gradient(circle at 50% 44%, #fffdf3 0%, #fff0c6 22%, var(--gold) 50%, rgba(244,196,106,0.35) 74%, rgba(244,196,106,0) 100%);
  box-shadow: 0 0 70px 14px rgba(244,196,106,0.32), 0 0 150px 40px rgba(244,196,106,0.1);
  animation: shimmer 5s ease-in-out infinite;
  transition: transform 0.5s cubic-bezier(.2,.7,.2,1);
}
.well .ripple { border: 1px solid rgba(244,196,106,0.55); animation: ripple 4.5s ease-out infinite; }
.well .ripple:nth-child(2) { animation-delay: 1.5s; }
.well .ripple:nth-child(3) { animation-delay: 3s; }
.well:active .pool { transform: scale(1.1); }
.well.on .pool { transform: scale(1.45); }
@keyframes ripple { from { transform: scale(1); opacity: 0.8; } to { transform: scale(2.05); opacity: 0; } }
@keyframes shimmer { 0%,100% { filter: brightness(0.95); } 50% { filter: brightness(1.12); } }
.today-line {
  width: 100%;
  max-width: 26rem;
  box-sizing: border-box;
  padding: 12px 16px;
  border: 1px solid rgba(244,196,106,0.3);
  border-radius: 14px;
  background: rgba(244,196,106,0.06);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.today-line span { font-style: italic; overflow-wrap: anywhere; }

/* Tap In rituals */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.theme {
  font-family: var(--label);
  font-size: 0.78rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 9px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--field);
  color: var(--ash);
}
.theme:hover { color: var(--bone); }
.theme[aria-pressed="true"] { border-color: var(--gold); color: var(--bone); background: rgba(244,196,106,0.14); }
.stream, .affirms { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.stream li { opacity: 0; animation: drift 1.6s ease both; }
@keyframes drift { from { opacity: 0; transform: translateY(18px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
.stream button, .affirms button {
  width: 100%;
  text-align: left;
  font-style: italic;
  font-size: 1.08rem;
  line-height: 1.45;
  padding: 12px 16px 12px 42px;
  position: relative;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--field);
  color: var(--bone);
  overflow-wrap: anywhere;
  transition: border-color 0.4s, background 0.4s, box-shadow 0.4s;
}
.stream button::before, .affirms button::before { content: "✦"; position: absolute; left: 16px; top: 13px; font-style: normal; font-size: 0.8em; color: var(--ash); transition: color 0.4s, text-shadow 0.4s; }
.stream button[aria-pressed="true"], .affirms button[aria-pressed="true"] { border-color: var(--gold); background: rgba(244,196,106,0.12); box-shadow: 0 0 30px rgba(244,196,106,0.15); }
.stream button[aria-pressed="true"]::before, .affirms button[aria-pressed="true"]::before { color: var(--gold); text-shadow: 0 0 12px var(--gold); }
.affirms button { font-family: var(--display); font-style: normal; font-size: clamp(1.15rem, 3.8vw, 1.4rem); line-height: 1.3; }
.risen-title.long { font-size: clamp(2.2rem, 9.5vw, 4.2rem); letter-spacing: 0.14em; }
.saga .found { font-size: 1.02rem; color: var(--gold); overflow-wrap: anywhere; }

@media (prefers-reduced-motion: reduce) {
  .scene, .big-list li, .stream li { animation: none; opacity: 1; }
  .ember .core, .well .pool, .well .ripple { animation: none; }
  .breath .orb { transition: none; }
}
</style>

<div class="sky"><div class="base"></div><div class="gold"></div><div class="dawn"></div></div>
<canvas id="embers" aria-hidden="true"></canvas>

<div class="app" id="appScroll">
  <header class="topbar">
    <button class="wordmark" id="homeBtn" type="button" aria-label="Back to the ember">RISING</button>
    <button class="ghost" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
  </header>
  <main class="stage" id="stage" aria-live="polite"></main>
</div>

<script>
(() => {
  // ================= state =================
  // One state object: myth, letters, saga, and Tap In (attunement + the days you tapped in). Saved in this browser right away,
  // and synced to the viewer's own Claude account when the page runs as an artifact.
  const KEY = "rising.state.v2";
  const PREFS = "rising.prefs";
  const FOLLOW_MS = 10 * 60 * 1000; // ask "did the fire carry?" once a chapter is 10+ minutes old
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function normalize(s) {

      tabs.forEach(t => t.onclick = () => go(t.dataset.side, true));
      let raf = 0;
      split.addEventListener("scroll", () => {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
          if (wide.matches) return;
          const s = split.scrollLeft > split.clientWidth / 2 ? "tap" : "rise";
          if (s !== prefs.side) mark(s);
        });
      }, { passive: true });
      const onWide = () => go(prefs.side);
      wide.addEventListener("change", onWide);
      cleanup.push(() => wide.removeEventListener("change", onWide));
      go(side, false);
      rise.bind(el.querySelector("#side-rise"));
      tap.bind(el.querySelector("#side-tap"));
    }, "home");
  }

  function bindHold(btn, ring, txt) {
    const DUR = 2200, LEN = 301.6, label = txt.textContent;
    let t0 = 0, raf = 0, done = false, lastQ = 0;
    const set = h => { ring.style.strokeDashoffset = LEN * (1 - h); btn.style.setProperty("--h", h); embers.intensity = 0.25 + h * 2.5; audio.hold(h); };
    const step = now => {
      const h = Math.min(1, (now - t0) / DUR); set(h);
      const q = Math.floor(h * 4); if (q > lastQ) { lastQ = q; vibrate(12 + q * 6); }
      if (h >= 1) {
        done = true; txt.textContent = prefs.mode === "fading" ? "Rising" : "Stoking";
        vibrate([30, 40, 90]); embers.burst(110); audio.ignite();
        setTimeout(() => prefs.mode === "fading" ? beginRitual() : beginStoke(), 450);
        return;
      }
      raf = requestAnimationFrame(step);
    };
    const down = e => { if (done) return; e.preventDefault(); touchStart(); t0 = performance.now(); lastQ = 0; txt.textContent = "Keep holding"; vibrate(15); raf = requestAnimationFrame(step); };
    const up = () => { if (done) return; cancelAnimationFrame(raf); set(0); txt.textContent = label; };
    btn.addEventListener("pointerdown", down);
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, up));
    btn.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) down(e); });
    btn.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") up(); });
    btn.addEventListener("contextmenu", e => e.preventDefault());
  }

  // ================= forging =================
  const mythFieldHTML = (f, val) => f.type === "line"

  function forge(i, draft) {
    setDawn(i / FORGE.length * 0.35);
    const f = FORGE[i];
    const reforging = !!S.myth && !S.sample;
    const val = draft[f.key] || "";
    const meter = FORGE.map((_, j) => `<span class="${j <= i ? "on" : ""}"></span>`).join("");
    const field = f.type === "letter"
      ? `<textarea id="forge-letter" class="tall" placeholder="Hey. If you're reading this…" autofocus>${esc(draft.letter || "")}</textarea>${voiceFieldHTML("fl")}`
      : mythFieldHTML(f, val);
    const q = f.type === "letter" && reforging ? "Write another letter for the day you fade." : f.q;
    const hint = f.type === "letter" && reforging ? `Your ${S.letters.length === 1 ? "first letter stays" : `${S.letters.length} letters stay`} in the library. This one is optional.` : f.hint;
    render(`
      <div class="meter" aria-hidden="true">${meter}</div>
      <p class="eyebrow">The Forging · Rite ${roman(i + 1)} of ${roman(FORGE.length)}</p>
      <h2>${esc(q)}</h2>
      <p class="lede">${esc(hint)}</p>
      ${field}
      <div class="actions">
        <button class="btn" id="next" type="button">${i === FORGE.length - 1 ? "Seal the myth" : "Continue"}</button>
        <button class="ghost" id="back" type="button">${i > 0 ? "Back" : "Cancel"}</button>
      </div>`, el => {
      const input = el.querySelector(f.type === "letter" ? "#forge-letter" : `#forge-${f.key}`);
      if (f.type === "letter") mountVoiceField(el, "fl", draft.letterBlob || null, b => { draft.letterBlob = b; });
      const keep = () => { draft[f.key] = input.value.trim(); };
      el.querySelector("#next").onclick = async () => {
        keep();
        if (i < FORGE.length - 1) return forge(i + 1, draft);
        el.querySelector("#next").disabled = true;
        const { letter, letterBlob, ...myth } = draft;
        if (S.sample) { S.saga = []; S.letters = S.letters.filter(l => !l.sample); }
        S.myth = { ...myth, forgedAt: (S.myth && !S.sample && S.myth.forgedAt) || Date.now() };
        S.sample = false;
        save();
        await addLetter(letter, letterBlob);
        sealed();
      };
      el.querySelector("#back").onclick = () => { keep(); i > 0 ? forge(i - 1, draft) : home(); };
      if (f.type === "line") input.addEventListener("keydown", e => { if (e.key === "Enter") el.querySelector("#next").click(); });
    }, "forge");
  }

  function runScenes(scenes, onDone, light = false) {
    let idx = 0;
    const go = () => { vibrate(10); audio.tap(); idx++; idx < scenes.length ? show() : onDone(); };
    const show = () => {
      const s = scenes[idx], t = Math.min(0.92, (idx + 1) / (scenes.length + 1));
      light ? setDawn(t * 0.2, 0.5 + t * 0.5) : setDawn(t);
      render(s.html(), el => {
        s.mount && s.mount(el, go);
        const b = el.querySelector("[data-next]");
        b.onclick = async () => {
          b.disabled = true;
          try { s.leave && await s.leave(el); } catch {}
          go();
        };
      }, "ritual");
    };
    show();
  }

  function risen(entry) {

  // A card is { seed, eyebrow, title, label, text, light, name, alt, note }.

  const chapterCard = ch => ({

  const tapCard = t => ({

  async function drawCard(card) {
    const W = 1080, H = 1350, c = document.createElement("canvas");
    c.width = W; c.height = H;
    const x = c.getContext("2d"), light = !!card.light;
    const fonts = ["150px Marcellus", "34px Marcellus", "italic 300 54px Spectral", "500 28px Jost"];
    await Promise.race([Promise.all(fonts.map(f => document.fonts.load(f).catch(() => null))), new Promise(r => setTimeout(r, 2500))]);
    let seed = card.seed * 9301 + 49297;
    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    // sky
    const sky = x.createLinearGradient(0, 0, 0, H);
    if (light) { sky.addColorStop(0, "#3a2c4e"); sky.addColorStop(0.45, "#1d1733"); sky.addColorStop(1, "#120f24"); }
    else { sky.addColorStop(0, "#0e0b1c"); sky.addColorStop(0.5, card.title === "RISEN" ? "#2a1a40" : "#34204a"); sky.addColorStop(1, card.title === "RISEN" ? "#6a2f4f" : "#7a3448"); }
    x.fillStyle = sky; x.fillRect(0, 0, W, H);
    const glow = light ? x.createRadialGradient(W / 2, -H * 0.08, 0, W / 2, -H * 0.08, H * 0.8) : x.createRadialGradient(W / 2, H * 1.08, 0, W / 2, H * 1.08, H * 0.75);
    if (light) { glow.addColorStop(0, "rgba(255,232,170,0.6)"); glow.addColorStop(0.4, "rgba(244,196,106,0.2)"); glow.addColorStop(1, "rgba(244,196,106,0)"); }
    else { glow.addColorStop(0, "rgba(255,178,107,0.85)"); glow.addColorStop(0.35, "rgba(255,140,72,0.45)"); glow.addColorStop(0.7, "rgba(196,86,106,0.18)"); glow.addColorStop(1, "rgba(59,37,80,0)"); }
    x.fillStyle = glow; x.fillRect(0, 0, W, H);
    // the ember, or the pool of light with its ripples
    const ex = W / 2, ey = 360;
    const halo = x.createRadialGradient(ex, ey, 0, ex, ey, 300);
    halo.addColorStop(0, light ? "rgba(244,196,106,0.45)" : "rgba(255,123,62,0.55)"); halo.addColorStop(1, light ? "rgba(244,196,106,0)" : "rgba(255,123,62,0)");
    x.fillStyle = halo; x.fillRect(0, 0, W, H);
    if (light) {
      [150, 200, 255].forEach((r, i) => { x.strokeStyle = `rgba(244,196,106,${0.5 - i * 0.14})`; x.lineWidth = 2; x.beginPath(); x.arc(ex, ey, r, 0, Math.PI * 2); x.stroke(); });
    }
    const core = x.createRadialGradient(ex, ey + (light ? -10 : 14), 0, ex, ey, 120);
    if (light) { core.addColorStop(0, "#fffdf3"); core.addColorStop(0.22, "#fff0c6"); core.addColorStop(0.5, "#f4c46a"); core.addColorStop(0.75, "rgba(244,196,106,0.35)"); core.addColorStop(1, "rgba(244,196,106,0)"); }
    else { core.addColorStop(0, "#fff3d6"); core.addColorStop(0.18, "#f4c46a"); core.addColorStop(0.45, "#ff7b3e"); core.addColorStop(0.7, "rgba(196,60,40,0.85)"); core.addColorStop(1, "rgba(120,30,40,0)"); }
    x.fillStyle = core; x.beginPath(); x.arc(ex, ey, 120, 0, Math.PI * 2); x.fill();
    // sparks
    x.globalCompositeOperation = "lighter";
    for (let i = 0; i < 110; i++) {
      const px = ex + (rnd() - 0.5) * 760 * rnd(), py = light ? ey + (rnd() - 0.5) * 560 : ey + 60 - rnd() * 420, r = 2 + rnd() * 5, a = 0.25 + rnd() * 0.6;
      const g = x.createRadialGradient(px, py, 0, px, py, r * 3);
      g.addColorStop(0, `hsla(${(light ? 38 : 18) + rnd() * (light ? 16 : 28)},100%,${light ? 76 : 70}%,${a})`); g.addColorStop(1, "hsla(30,100%,50%,0)");
      x.fillStyle = g; x.beginPath(); x.arc(px, py, r * 3, 0, Math.PI * 2); x.fill();
    }
    x.globalCompositeOperation = "source-over";
    // text
    x.textAlign = "center"; x.textBaseline = "alphabetic";
    const widthOf = (t, em) => { const gap = parseFloat(/(\d+)px/.exec(x.font)[1]) * em, chars = [...t]; return chars.reduce((s, ch) => s + x.measureText(ch).width, 0) + gap * (chars.length - 1); };
    const spaced = (t, y, em) => {
      const gap = parseFloat(/(\d+)px/.exec(x.font)[1]) * em;
      let cx = W / 2 - widthOf(t, em) / 2;
      x.textAlign = "left";
      for (const chr of [...t]) { x.fillText(chr, cx, y); cx += x.measureText(chr).width + gap; }
      x.textAlign = "center";
    };
    x.font = "500 28px Jost"; x.fillStyle = "#a99fbb";
    spaced(card.eyebrow.toUpperCase(), 680, 0.24);
    let size = 150;
    x.font = `${size}px Marcellus`;
    while (size > 80 && widthOf(card.title, 0.18) > 940) x.font = `${size -= 6}px Marcellus`;
    x.fillStyle = "#fff4e2";
    x.shadowColor = light ? "rgba(255,226,150,0.6)" : "rgba(255,170,90,0.6)"; x.shadowBlur = 50;
    spaced(card.title, 850, 0.18);
    x.shadowBlur = 0;
    x.font = "500 26px Jost"; x.fillStyle = "#f4c46a";
    spaced(card.label, 960, 0.24);
    x.font = "italic 300 54px Spectral"; x.fillStyle = "#f4ede3";
    const words = String(card.text || "").split(/\s+/).filter(Boolean), out = [];
    let line = "";
    for (const w of words) {
      const t = line ? line + " " + w : w;
      if (x.measureText(`“${t}”`).width > 860 && line) { out.push(line); line = w; } else line = t;
    }
    if (line) out.push(line);
    if (out.length > 3) { out.length = 3; out[2] = out[2].replace(/\s*\S*$/, "") + "…"; }
    out.forEach((l, i) => x.fillText(`${i === 0 ? "“" : ""}${l}${i === out.length - 1 ? "”" : ""}`, W / 2, 1040 + i * 70));
    x.font = "34px Marcellus"; x.fillStyle = "#f4c46a";
    spaced("RISING", H - 90, 0.42);
    return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("no image")), "image/png"));
  }

  function cardView(card, back) {
    card.light ? setDawn(0.1, 0.8) : setDawn(0.6);
    const name = card.name;
    render(`
      <p class="eyebrow">${esc(card.eyebrow)}</p>
      <img class="card-preview" id="card" alt="${esc(card.alt)}" hidden>

        <button class="ghost" id="back" type="button">Back</button>
      </div>`, async el => {
      el.classList.add("center");
      el.querySelector("#back").onclick = back;
      const img = el.querySelector("#card"), msg = el.querySelector("#cardMsg"), btn = el.querySelector("#saveCard");
      let blob;
      try { blob = await drawCard(card); } catch { msg.textContent = "This browser couldn't draw the card."; return; }
      if (!el.isConnected) return;
      const url = URL.createObjectURL(blob);
      cleanup.push(() => URL.revokeObjectURL(url));
      img.src = url; img.hidden = false;
      const file = typeof File === "function" ? new File([blob], name, { type: "image/png" }) : null;
      const dl = await downloadsP;
      const canShare = !dl && file && navigator.canShare && navigator.canShare({ files: [file] });
      btn.textContent = canShare ? "Share image" : "Save image";
      msg.textContent = card.note;
      btn.disabled = false;
      btn.onclick = async () => {
        btn.disabled = true;
        try {
          if (dl) { await dl.save({ filename: name, data: blob }); msg.textContent = "Saved."; }
          else if (canShare) { await navigator.share({ files: [file], title: "RISING" }); }
          else {
            const a = document.createElement("a"); a.href = url; a.download = name;
            document.body.appendChild(a); a.click(); a.remove();
            msg.textContent = "Saved to your downloads.";
          }
        } catch (e) {
          const code = e && (e.code || e.name);
          if (code === "unavailable" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed") msg.textContent = "Saving isn't available here. Press and hold the card to save it.";
          else if (code === "rate_limited") msg.textContent = "One moment, then try again.";
        }
        btn.disabled = false;
      };
    }, "card");
  }

  const THEME_LINES = {
    Love: ["Love is moving toward you, and through you.", "Someone wants to tell you what you mean to them."],
    Ideas: ["The idea you've been circling might land today.", "Inspiration likes to show up while you're doing something else."],
    Money: ["Money can arrive from directions you haven't thought of.", "An opportunity worth saying yes to could show up today."],
    People: ["The right person could walk into your day.", "Someone out there is looking for exactly what you have to give."],
    Adventure: ["There's an unexplored path right next to the one you take every day.", "Today can surprise you if you let it."],
    Health: ["Your body is working for you right now, a million times a second.", "Energy comes back faster than you think."],
    Peace: ["Stillness is there in any minute you choose.", "Something heavy could get lighter today."],
    Creativity: ["Something wants to be made by you.", "One good line, one good note, one good frame. That's a day."],
    Luck: ["Luck tends to find people who are paying attention.", "Timing is about to work in your favor."],
    Joy: ["Joy can find you in the smallest thing today.", "Something today will make you glad you were here."],
  };
  // Every possibility this attunement can draw from, in a stable order.
  function streamPool(a) {
    const themed = (a.themes || []).flatMap(t => THEME_LINES[t] || [`Today has room for ${t.toLowerCase()}. Some of it is meant for you.`]);
    const signs = lines(a.signs).map(s => `It might arrive as ${s[0].toLowerCase() + s.slice(1).replace(/[.!]+$/, "")}.`);
    return [...themed, ...signs, ...POSSIBLE];
  }
  function pickStream(a) {
    const themed = shuffle((a.themes || []).flatMap(t => THEME_LINES[t] || [`Today has room for ${t.toLowerCase()}. Some of it is meant for you.`])).slice(0, 2);
    const sign = shuffle(lines(a.signs)).slice(0, 1).map(s => `It might arrive as ${s[0].toLowerCase() + s.slice(1).replace(/[.!]+$/, "")}.`);
    return shuffle([...themed, ...sign, ...shuffle(POSSIBLE).slice(0, 5 - themed.length - sign.length)]);
  }

  function attuneFieldHTML(f, val) {
    if (f.type !== "themes") return mythFieldHTML(f, val);
    const sel = Array.isArray(val) ? val : [], own = sel.filter(t => !THEMES.includes(t));
    return `
      <div class="chips" role="group" aria-label="Themes">${THEMES.map(t => `<button type="button" class="theme" data-theme="${t}" aria-pressed="${sel.includes(t)}">${t}</button>`).join("")}</div>
      <input type="text" id="attune-own" value="${esc(own.join(", "))}" placeholder="Your own, separated by commas" autocomplete="off">`;
  }
  function mountAttuneField(el, f) {
    el.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true")); vibrate(8); });
  }
  function readAttuneField(el, f) {
    if (f.type !== "themes") return el.querySelector(`#forge-${f.key}`).value.trim();
    const picked = [...el.querySelectorAll('[data-theme][aria-pressed="true"]')].map(b => b.dataset.theme);
    const own = el.querySelector("#attune-own").value.split(",").map(t => t.trim()).filter(Boolean).map(t => t[0].toUpperCase() + t.slice(1));
    return [...new Set([...picked, ...own])];
  }

  function attune(i, draft) {
    setDawn(0.05, 0.3 + i / ATTUNE.length * 0.5);
    const f = ATTUNE[i];
    const meter = ATTUNE.map((_, j) => `<span class="${j <= i ? "on" : ""}"></span>`).join("");
    render(`
      <div class="meter" aria-hidden="true">${meter}</div>
      <p class="eyebrow">Attuning · ${roman(i + 1)} of ${roman(ATTUNE.length)}</p>
      <h2>${esc(f.q)}</h2>
      <p class="lede">${esc(f.hint)}</p>
      ${attuneFieldHTML(f, draft[f.key])}
      <div class="actions">
        <button class="btn" id="next" type="button">${i === ATTUNE.length - 1 ? "Attune" : "Continue"}</button>
        <button class="ghost" id="back" type="button">${i > 0 ? "Back" : "Cancel"}</button>
      </div>`, el => {
      mountAttuneField(el, f);
      const keep = () => { draft[f.key] = readAttuneField(el, f); };
      el.querySelector("#next").onclick = () => {
        keep();
        if (i < ATTUNE.length - 1) return attune(i + 1, draft);
        S.attune = { ...draft, attunedAt: (S.attune && S.attune.attunedAt) || Date.now() };
        save();
        attuned();
      };
      el.querySelector("#back").onclick = () => { keep(); i > 0 ? attune(i - 1, draft) : home(); };
    }, "attuning");
  }

  function attuned() {
    setDawn(0.05, 1); embers.burst(70, 38); audio.chord([329.6, 493.9, 659.3], 0.05, 0.4, 3);
    render(`
      <p class="eyebrow">Attuning is complete</p>
      <h2>You're attuned.</h2>
      <p class="lede">The stream was always there. Now you know how to step into it. Tap in whenever you want to feel how full the day already is, and come back later to tell it what found you.</p>
      <div class="actions"><button class="btn" id="now" type="button">Tap in now</button><button class="ghost" id="later" type="button">Later</button></div>`,
      el => { el.querySelector("#now").onclick = () => { touchStart(); beginTapIn(); }; el.querySelector("#later").onclick = () => { prefs.side = "tap"; savePrefs(); home(); }; }, "attuned");
  }

  function attuneView(changed) {
    wake.off();
    setDawn(0.05, 0.6);
    const a = S.attune;
    const rows = ATTUNE.map(f => {
      const v = f.type === "themes" ? (a.themes || []).join(" · ") : f.list ? lines(a[f.key]).join("\n") : String(a[f.key] || "").trim();
      return `
      <li>
        <div class="body">
          <span class="label">${esc(f.label)}</span>
          ${v ? `<span class="val">${esc(v)}</span>` : `<span class="empty">Not written yet</span>`}
          ${f.key === changed ? `<span class="chip carried">Changed</span>` : ""}
        </div>
        <button class="ghost" data-edit="${f.key}" type="button" aria-label="Change ${esc(f.label.toLowerCase())}">${v ? "Change" : "Write"}</button>
      </li>`;
    }).join("");
    render(`
      <p class="eyebrow">Tap In</p>
      <h2>Your attunement.</h2>
      <p class="lede">What you're open to will shift. Change any part whenever it does.</p>
      <ul class="myth">${rows}</ul>
      <div class="actions">
        <button class="btn" id="back" type="button">Back to Tap In</button>
        <button class="ghost" id="reattune" type="button">Attune from the start</button>
      </div>
      <p class="fine">Attuned ${esc(fmtDate(a.attunedAt || Date.now()))}${a.editedAt ? ` · Last changed ${esc(fmtDate(a.editedAt))}` : ""}</p>`, el => {
      el.querySelector("#back").onclick = home;
      el.querySelector("#reattune").onclick = () => attune(0, { ...S.attune });
      el.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => editAttune(b.dataset.edit));
    }, "attune");
  }

  function editAttune(key) {
    const f = ATTUNE.find(x => x.key === key);
    setDawn(0.05, 0.6);
    render(`
      <p class="eyebrow">Your attunement · ${esc(f.label)}</p>
      <h2>${esc(f.q)}</h2>
      <p class="lede">${esc(f.hint)}</p>
      ${attuneFieldHTML(f, S.attune[key])}
      <div class="actions">
        <button class="btn" id="save" type="button">Save</button>
        <button class="ghost" id="cancel" type="button">Cancel</button>
      </div>`, el => {
      mountAttuneField(el, f);
      el.querySelector("#cancel").onclick = () => attuneView();
      el.querySelector("#save").onclick = () => {
        const v = readAttuneField(el, f);
        if (JSON.stringify(v) !== JSON.stringify(S.attune[key] ?? (f.type === "themes" ? [] : ""))) {
          S.attune[key] = v; S.attune.editedAt = Date.now(); save();
          embers.burst(30, 38); audio.chord([329.6, 493.9, 659.3], 0.04, 0.3, 2.5);
          return attuneView(key);
        }
        attuneView();
      };
    }, "edit");
  }

  // ---------- the daily tap-in ----------
  function beginTapIn() {
    wake.on();
    const a = S.attune, run = { caught: [], opening: "" };
    const scenes = [breathScene("First, the breath", "Breathe in the light.", 2, "I'm open")];

    const stream = pickStream(a);
    scenes.push({ html: () => `
      <p class="eyebrow">The stream</p>
      <h2>Look at what's moving today.</h2>
      <p class="lede">All of this is possible before the day is out. Tap whatever pulls at you.</p>
      <ul class="stream">${stream.map((s, i) => `<li style="animation-delay:${0.3 + i * 1.1}s"><button type="button" aria-pressed="false">${esc(s)}</button></li>`).join("")}</ul>
      <div class="actions"><button class="btn" data-next type="button">I see it</button></div>`,
      mount: el => el.querySelectorAll(".stream button").forEach(b => b.onclick = () => {
        const on = b.getAttribute("aria-pressed") !== "true";
        b.setAttribute("aria-pressed", String(on));
        if (on) { vibrate(12); audio.chord([659.3, 987.8], 0.02, 0.02, 1.4); }
      }),
      leave: el => { run.caught = [...el.querySelectorAll('.stream [aria-pressed="true"]')].map(b => b.textContent); } });

    const lately = S.flow.filter(t => t.found).slice(-3).reverse();
    if (a.proof || lately.length) scenes.push({ html: () => `
      <p class="eyebrow">The proof</p>
      <h2>It's happened before.</h2>
      ${a.proof ? `<p class="quote">${esc(a.proof)}</p>` : ""}
      ${lately.length ? `<p class="eyebrow">Lately, these found you</p>${listItems(lately.map(t => t.found), "small")}` : ""}
      <p class="lede">None of it came from nowhere. It came because you were open, and you still are.</p>
      <div class="actions"><button class="btn" data-next type="button">It finds me</button></div>` });

    const affs = shuffle(lines(a.affirmations)).slice(0, 5);
    if (affs.length) scenes.push({ html: () => `
      <p class="eyebrow">Affirm</p>
      <h2>Say it, then tap it.</h2>
      <p class="lede">Say each one out loud, or at least under your breath. Tap it once you mean it.</p>
      <ul class="affirms">${affs.map(x => `<li><button type="button" aria-pressed="false">${esc(x)}</button></li>`).join("")}</ul>
      <div class="actions"><button class="btn" data-next type="button" disabled>Affirmed</button></div>`,
      mount: el => {
        const bs = [...el.querySelectorAll(".affirms button")], next = el.querySelector("[data-next]");
        bs.forEach((b, i) => b.onclick = () => {
          if (b.getAttribute("aria-pressed") === "true") return;
          b.setAttribute("aria-pressed", "true");
          vibrate(20); embers.burst(20, 38); audio.chord([[440, 493.9, 554.4, 659.3, 740][i] || 880], 0.04, 0.05, 2);
          next.disabled = !bs.every(x => x.getAttribute("aria-pressed") === "true");
        });
      } });

    scenes.push({ html: () => `
      <p class="eyebrow">Your opening</p>
      <h2>Today I'm open to…</h2>
      ${run.caught.length ? `<p class="lede">You reached for: <em>${run.caught.map(esc).join("</em> · <em>")}</em></p>` : ""}
      <input type="text" id="opening" placeholder="A new idea. A real conversation. Money from somewhere unexpected." autocomplete="off" autofocus>
      ${(a.themes || []).length ? `<div class="chips">${a.themes.map(t => `<button type="button" class="theme" data-fill="${esc(t)}">${esc(t)}</button>`).join("")}</div>` : ""}
      <div class="actions"><button class="btn" data-next id="seal" type="button" disabled>I'm open</button></div>`,
      mount: el => {
        const i = el.querySelector("#opening"), b = el.querySelector("#seal");
        const upd = () => { b.disabled = !i.value.trim(); };
        i.addEventListener("input", upd);
        i.addEventListener("keydown", e => { if (e.key === "Enter" && i.value.trim()) b.click(); });
        el.querySelectorAll("[data-fill]").forEach(c => c.onclick = () => {
          const t = c.dataset.fill.toLowerCase(), v = i.value.trim();
          if (!v.toLowerCase().split(/,\s*|\s+and\s+/).includes(t)) i.value = v ? `${v}, ${t}` : t;
          c.setAttribute("aria-pressed", "true"); upd(); i.focus();
        });
      },
      leave: el => { run.opening = el.querySelector("#opening").value.trim(); } });

    runScenes(scenes, () => tappedIn({ opening: run.opening, caught: run.caught }), true);
  }

  function tappedIn(entry) {
    const t = { n: S.flow.length + 1, at: Date.now(), ...entry };
    S.flow.push(t);
    if (S.flow.length > 600) S.flow = S.flow.slice(-600);
    prefs.side = "tap"; savePrefs();
    save();
    embers.burst(160, 38); vibrate([30, 50, 30, 50, 90]); audio.chord([329.6, 415.3, 493.9, 659.3, 830.6], 0.08, 0.8, 5);
    tappedInScreen(t);
  }
  function tappedInScreen(t) {
    setDawn(0.15, 1);
    render(`
      <p class="eyebrow">Day ${roman(t.n)} · ${esc(fmtDate(t.at))}</p>
      <h1 class="risen-title long">TAPPED IN</h1>
      <p class="lede">Today you're open to <em>${esc(t.opening)}</em>.<br>Keep your eyes up. It's on its way.</p>
      <div class="actions">
        <button class="btn" id="done" type="button">I'm going</button>
        <button class="ghost" id="cardBtn" type="button">Share as image</button>
      </div>
      <p class="fine">Come back later and tell it what found you.</p>`, el => {
      el.classList.add("center");
      el.querySelector("#done").onclick = home;
      el.querySelector("#cardBtn").onclick = () => cardView(tapCard(t), () => tappedInScreen(t));
    }, "tapped");
  }

  function foundScene(t, back) {
    setDawn(0.05, 0.8);
    render(`
      <p class="eyebrow">Day ${roman(t.n)} · ${esc(fmtShort(t.at))}</p>
      <h2>What found you?</h2>
      <p class="lede">You opened to <em>${esc(t.opening)}</em>. Big or small, a message, a moment, an idea, a bit of luck, someone's kindness: name it and it counts.</p>
      <textarea id="foundTxt" placeholder="An old friend called out of nowhere…" autofocus>${esc(t.found || "")}</textarea>
      <div class="actions">
        <button class="btn" id="keep" type="button" disabled>Keep it</button>
        <button class="ghost" id="cancel" type="button">Cancel</button>
      </div>`, el => {
      const i = el.querySelector("#foundTxt"), keep = el.querySelector("#keep");
      const upd = () => { keep.disabled = !i.value.trim(); };
      i.addEventListener("input", upd); upd();
      el.querySelector("#cancel").onclick = back;
      keep.onclick = () => {
        t.found = i.value.trim(); t.foundAt = Date.now(); save();
        embers.burst(90, 38); vibrate([20, 40, 60]); audio.chord([329.6, 415.3, 493.9, 659.3], 0.06, 0.3, 3);
        render(`
          <p class="eyebrow">Day ${roman(t.n)}</p>
          <h2>It found you.</h2>
          <p class="quote">${esc(t.found)}</p>
          <p class="lede">That's going in the record. The more you notice, the more you'll see.</p>
          <div class="actions"><button class="btn" id="ok" type="button">Keep going</button></div>`,
          el2 => { el2.querySelector("#ok").onclick = back; }, "found");
      };
    }, "found");
  }

  function flowView() {
    wake.off();
    setDawn(0.05, 0.5);
    const kept = S.flow.filter(t => t.found).length;
    const items = S.flow.slice().reverse().map(t => `
      <li>
        <div class="num">${roman(t.n)}</div>
        <div class="body">
          <span class="date">${esc(fmtDate(t.at))} · Tapped in</span>
          <span class="vow">Open to: ${esc(t.opening)}</span>
          ${t.found ? `<span class="found">Found: ${esc(t.found)}</span>` : `<button class="ghost card-btn" data-found="${t.n}" type="button">Log what found you</button>`}
          <button class="ghost card-btn" data-card="${t.n}" type="button">Share as image</button>
        </div>
      </li>`).join("");
    render(`
      <p class="eyebrow">What found you</p>
      <h2>${kept ? `${kept} ${kept === 1 ? "thing has" : "things have"} found you.` : S.flow.length ? "Nothing logged yet." : "No days yet."}</h2>
      <p class="lede">${S.flow.length ? `You've tapped in ${S.flow.length === 1 ? "once" : `${S.flow.length} times`}. Each time you opened a door; this is what walked through it.` : "Each time you tap in, the day is written here, and later, what found you."}</p>
      ${items ? `<ol class="saga">${items}</ol>` : ""}
      <div class="actions"><button class="btn" id="back" type="button">Back to Tap In</button></div>
      <p class="fine">${esc(syncNote())}</p>`, el => {
      el.querySelector("#back").onclick = () => { prefs.side = "tap"; savePrefs(); home(); };
      const byN = n => S.flow.find(t => String(t.n) === n);
      el.querySelectorAll("[data-found]").forEach(b => b.onclick = () => { const t = byN(b.dataset.found); if (t) foundScene(t, flowView); });
      el.querySelectorAll("[data-card]").forEach(b => b.onclick = () => { const t = byN(b.dataset.card); if (t) cardView(tapCard(t), flowView); });
    }, "flow");
  }

  // ================= saga =================
  const syncNote = () => sync.status === "synced"
    ? "Your myth, letters, saga and Tap In sync to your Claude account. Voice clips stay on the device that recorded them."
    : "Saved in this browser only.";

  // Patterns in what dimmed you, when you fade, and how vows carry. Each line only
  // appears once there's enough saga behind it to mean something.
  const STOP = new Set(("a an and or but the i im ive id me my mine myself to of in on at for with from by is was were be been being am are " +
    "it its that this these those just so too very really much more most no not nothing all any some again still got get getting " +
    "keep kept feel feeling felt like day days today yesterday tonight week weeks time times one two three four five six seven eight nine ten " +
    "couple few lot lots bit kind sort thing things stuff out up down off over about into than then there their them they he she we you your " +
    "our us had has have having do did does doing dont didnt cant couldnt wont wasnt isnt what when where why how which who because since " +
    "after before while also even ever never always now lately last way back").split(" "));
  function termsOf(s) {
    const out = new Map();
    String(s || "").toLowerCase().replace(/[’']/g, "").split(/[^a-z]+/).forEach(w => {
      if (w.length < 3 || STOP.has(w)) return;
      const stem = w.length > 4 && w.endsWith("s") && !w.endsWith("ss") ? w.slice(0, -1) : w;
      if (!STOP.has(stem) && !out.has(stem)) out.set(stem, w);
    });
    return out;
  }
  function sagaPatterns() {
    const out = [], now = Date.now(), MONTH = 30 * 864e5;
    const descents = fadingChapters();
    const named = descents.filter(c => c.dimmed);
    const recent = named.filter(c => now - c.at < MONTH);
    const pool = recent.length >= 3 ? recent : named;
    const scope = pool === recent && recent.length < named.length ? " in the last 30 days" : "";
    if (pool.length >= 3) {
      const counts = new Map(); // stem -> { n, forms }
      pool.forEach(c => termsOf(c.dimmed).forEach((form, stem) => {
        const e = counts.get(stem) || { n: 0, forms: new Map() };
        e.n++; e.forms.set(form, (e.forms.get(form) || 0) + 1); counts.set(stem, e);
      }));
      const shadowStems = S.myth && S.myth.shadow ? [...termsOf(S.myth.shadow).keys()] : [];
      const shadowHits = shadowStems.length ? pool.filter(c => shadowStems.some(t => termsOf(c.dimmed).has(t))).length : 0;
      const top = [...counts.entries()].filter(([stem, e]) => e.n >= 2 && !shadowStems.includes(stem)).sort((a, b) => b[1].n - a[1].n).slice(0, 3)
        .map(([, e]) => ({ n: e.n, word: [...e.forms.entries()].sort((a, b) => b[1] - a[1])[0][0] }));
      if (top.length) {
        const [first, ...rest] = top;
        out.push({ kind: "words", html: `<em>“${esc(first.word)}”</em> came up in ${first.n} of ${pool.length} descents${scope}.${rest.length ? ` Also ${rest.map(t => `<em>“${esc(t.word)}”</em> (${t.n})`).join(" and ")}.` : ""}` });
      }
      if (shadowHits >= 2) out.push({ kind: "shadow", html: `Your shadow, <em>${esc(S.myth.shadow)}</em>, was named in ${shadowHits} of them.` });
    }
    if (descents.length >= 4) {
      const parts = [["in the morning", h => h >= 5 && h < 12], ["in the afternoon", h => h >= 12 && h < 17], ["in the evening", h => h >= 17 && h < 22], ["late at night", h => h >= 22 || h < 5]];
      const tally = parts.map(([label, test]) => ({ label, n: descents.filter(c => test(new Date(c.at).getHours())).length })).sort((a, b) => b.n - a.n);
      if (tally[0].n >= 3 && tally[0].n / descents.length >= 0.4) out.push({ kind: "time", html: `You fade most often ${tally[0].label}: ${tally[0].n} of your ${descents.length} descents.` });
    }
    const answered = S.saga.filter(c => c.outcome === "carried" || c.outcome === "not-yet");
    if (answered.length >= 3) {
      const kept = answered.filter(c => c.outcome === "carried").length;
      out.push({ kind: "carry", html: kept
        ? `${kept} of the ${answered.length} vows you checked on carried.${kept / answered.length < 0.5 ? " Smaller vows tend to carry further." : ""}`
        : `None of the ${answered.length} vows you checked on have carried yet. Try a smaller one next time: ten minutes, one set, one page.` });
    }
    return out;
  }

  function sagaView() {
    wake.off();
    setDawn(0.2);
    const items = S.saga.slice().reverse().map(c => `
      <li>
        <div class="num">${roman(c.n)}</div>
        <div class="body">
          <span class="date">${esc(fmtDate(c.at))} · ${c.mode === "rising" ? "Stoked" : "Risen"}</span>
          <span class="vow">${c.mode === "rising" ? "Fed it with" : "Vowed"}: ${esc(c.vow)}</span>
          ${c.dimmed ? `<span class="dim">Rose from: ${esc(c.dimmed)}</span>` : ""}
          ${c.lit ? `<span class="dim">Burning with: ${esc(c.lit)}</span>` : ""}
          ${c.outcome === "carried" ? `<span class="chip carried">It carried</span>` : c.outcome === "not-yet" ? `<span class="chip">Not yet</span>` : ""}
          ${c.vow ? `<button class="ghost card-btn" data-card="${c.n}" type="button">Share as image</button>` : ""}
        </div>
      </li>`).join("");
    const carried = S.saga.filter(c => c.outcome === "carried").length;
    const shows = sagaPatterns();
    const rateShown = shows.some(p => p.kind === "carry");
    render(`
      <p class="eyebrow">The saga of ${esc(S.myth?.name || "you")}</p>
      <h2>${S.saga.length ? `${S.saga.length} ${S.saga.length === 1 ? "chapter" : "chapters"} so far.` : "No chapters yet."}</h2>
      <p class="lede">${S.saga.length ? `None of these are failures. Each one is a time you came back or kept the fire going.${carried && !rateShown ? ` ${carried} ${carried === 1 ? "vow has" : "vows have"} carried.` : ""}` : "Each time you hold the ember, a chapter is written here."}</p>
      ${shows.length ? `
        <div class="mirror">
          <p class="eyebrow">What the saga shows</p>
          <ul>${shows.map(p => `<li>${p.html}</li>`).join("")}</ul>
          <p class="fine">A mirror, not a score. Knowing what pulls you under is how you see it coming.</p>
        </div>` : ""}
      ${items ? `<ol class="saga">${items}</ol>` : ""}
      <div class="actions">
        <button class="btn" id="back" type="button">Back to the ember</button>
        <button class="ghost" id="lettersBtn" type="button">Your letters</button>
      </div>
      <p class="fine">${esc(syncNote())}</p>`,
      el => {
        el.querySelector("#back").onclick = home;
        el.querySelector("#lettersBtn").onclick = lettersView;
        el.querySelectorAll("[data-card]").forEach(b => b.onclick = () => {
          const ch = S.saga.find(c => String(c.n) === b.dataset.card);
          if (ch) cardView(chapterCard(ch), sagaView);
        });
      }, "saga");
  }

  // ================= letters =================
  function lettersView() {
    wake.off();
    setDawn(0.15);
    const list = S.letters.slice().reverse();
    render(`
      <p class="eyebrow">Letters from your strong days</p>
      <h2>${list.length ? `${list.length} ${list.length === 1 ? "letter" : "letters"} waiting.` : "No letters yet."}</h2>
      <p class="lede">When you're fading, RISING reads you the one you've heard least recently. Write a new one whenever you feel strong.</p>
      <div class="actions"><button class="btn" id="write" type="button">Write a new letter</button><button class="ghost" id="back" type="button">Back to the ember</button></div>
      ${list.length ? `<ul class="letters">${list.map(l => `
        <li class="letter-card" data-id="${esc(l.id)}">
          <span class="eyebrow">${esc(fmtDate(l.at))}${l.voice ? " · In your voice" : ""}${l.shown ? ` · Last read ${esc(fmtShort(l.shown))}` : ""}</span>
          ${l.text ? `<p class="clip">${esc(l.text)}</p>` : ""}
          <div class="actions">
            ${l.voice ? `<button class="pill" data-play type="button" hidden><span class="dot"></span><span class="lbl">Play</span></button>` : ""}
            <button class="ghost" data-del type="button">Delete</button>
          </div>
        </li>`).join("")}</ul>` : ""}
      <p class="fine">${esc(syncNote())}</p>`, el => {
      el.querySelector("#write").onclick = composeLetter;
      el.querySelector("#back").onclick = home;
      el.querySelectorAll(".letter-card").forEach(card => {
        const id = card.dataset.id;
        const play = card.querySelector("[data-play]");
        if (play) voiceDB.get(id).then(blob => {
          if (!blob || !card.isConnected) return;
          const url = URL.createObjectURL(blob), a = new Audio(url);
          play.hidden = false;
          const lbl = play.querySelector(".lbl");
          a.onplay = () => { lbl.textContent = "Pause"; play.classList.add("rec"); };
          a.onpause = a.onended = () => { lbl.textContent = "Play"; play.classList.remove("rec"); };
          play.onclick = () => a.paused ? a.play().catch(() => {}) : a.pause();
          cleanup.push(() => { a.pause(); URL.revokeObjectURL(url); });
        });
        const del = card.querySelector("[data-del]");
        del.onclick = () => {
          if (del.dataset.armed) {
            S.letters = S.letters.filter(l => l.id !== id); save(); voiceDB.del(id); lettersView();
          } else { del.dataset.armed = "1"; del.textContent = "Tap again to delete"; setTimeout(() => { if (del.isConnected) { delete del.dataset.armed; del.textContent = "Delete"; } }, 3000); }
        };
      });
    }, "letters");
  }

  function composeLetter() {
    setDawn(0.3);
    let blob = null;
    render(`
      <p class="eyebrow">A letter for the day you fade</p>
      <h2>Say what you'll need to hear.</h2>
      <p class="lede">Write it, record it in your own voice, or both.</p>
      <textarea id="compose" class="tall" placeholder="Hey. If you're reading this…" autofocus></textarea>
      ${voiceFieldHTML("cv")}
      <div class="actions"><button class="btn" id="seal" type="button">Seal the letter</button><button class="ghost" id="cancel" type="button">Cancel</button></div>`, el => {
      mountVoiceField(el, "cv", null, b => { blob = b; });
      el.querySelector("#cancel").onclick = lettersView;
      el.querySelector("#seal").onclick = async () => {
        const t = el.querySelector("#compose").value;
        if (!t.trim() && !blob) { el.querySelector("#compose").focus(); return; }
        el.querySelector("#seal").disabled = true;
        await addLetter(t, blob);
        embers.burst(50); audio.chord([220, 329.6, 440], 0.04, 0.3, 2.5);
        lettersView();
      };
    }, "compose");
  }

  // ================= boot =================
  document.getElementById("homeBtn").onclick = () => { if (view !== "home") home(); };
  sync.onPulled = () => {
    const views = { home, saga: sagaView, letters: lettersView, flow: flowView, myth: () => S.myth ? mythView() : home(), attune: () => S.attune ? attuneView() : home() };
    if (views[view]) views[view]();
  };
  home();
  sync.init();
})();
</script>
